<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BANG_SAM12</title>

<style>

body{
background:#07142c;
font-family:Arial,sans-serif;
color:white;
margin:0;
padding:15px;
}

.container{
max-width:700px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
margin:0;
font-size:36px;
font-weight:bold;
}

.header p{
margin-top:5px;
font-size:14px;
opacity:.8;
}

.card{
background:#0d2348;
padding:15px;
border-radius:15px;
border:1px solid #174f9e;
margin-bottom:15px;
}

.row{
display:flex;
gap:10px;
margin-bottom:10px;
}

.row select,
.row input{
flex:1;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:none;
border-radius:10px;
box-sizing:border-box;
}

textarea{
min-height:120px;
resize:vertical;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#6d4cff,#00c6ff);
color:white;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

#result{
min-height:120px;
border:1px dashed #4da3ff;
padding:10px;
border-radius:10px;
}

#preview{
width:100%;
display:none;
margin-top:10px;
border-radius:10px;
}

small{
opacity:.8;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>BANG_SAM12</h1>
<p>Grok & Kling Studio</p>
</div>

<div class="card">

<input
type="password"
placeholder="Masukkan API Key">

<button id="cekApi">
CEK API
</button>

<small>Status: Belum dicek</small>

</div>

<div class="card">

<div class="row">

<select id="provider">
<option>Kling</option>
<option>Grok</option>
</select>

<select id="model">
<option>Kling 2.1 Pro</option>
<option>Kling 2.1</option>
<option>Grok 4</option>
<option>Grok 3</option>
<option>Grok 3 Mini</option>
</select>

</div>

<div class="row">

<select id="mode">
<option>Image to Video</option>
<option>Text to Video</option>
<option>Image to Image</option>
<option>Text to Image</option>
<option>Chat</option>
</select>

<select id="resolusi">
<option selected>720p</option>
<option>480p</option>
<option>1080p</option>
</select>

</div>

<div class="row">

<select id="rasio">
<option selected>9:16</option>
<option>1:1</option>
<option>16:9</option>
</select>

<select id="durasi">
<option>5 Detik</option>
<option>10 Detik</option>
</select>

</div>

<div id="outputBox">

<select id="output">
<option selected>Output 1</option>
<option>Output 2</option>
<option>Output 3</option>
<option>Output 4</option>
</select>

</div>

<br>

<input
type="file"
id="upload"
accept="image/*">

<img id="preview">

<br><br>

<textarea
id="prompt"
placeholder="Masukkan Prompt"></textarea>

<button id="generateBtn">
GENERATE
</button>

</div>

<div class="card">

<h3>HASIL</h3>

<div id="result">
Belum ada hasil
</div>

<button id="downloadBtn">
DOWNLOAD
</button>

</div>

</div>

<script>

const mode=document.getElementById("mode");
const outputBox=document.getElementById("outputBox");
const provider=document.getElementById("provider");
const durasi=document.getElementById("durasi");
const upload=document.getElementById("upload");
const preview=document.getElementById("preview");
const generateBtn=document.getElementById("generateBtn");

mode.addEventListener("change",()=>{

if(
mode.value==="Image to Video" ||
mode.value==="Text to Video"
){
outputBox.style.display="none";
}else{
outputBox.style.display="block";
}

});

provider.addEventListener("change",()=>{

if(provider.value==="Kling"){

durasi.innerHTML=`
<option>5 Detik</option>
<option>10 Detik</option>
`;

}else{

durasi.innerHTML=`
<option>6 Detik</option>
<option>10 Detik</option>
`;

}

});

upload.addEventListener("change",(e)=>{

const file=e.target.files[0];

if(file){

preview.src=URL.createObjectURL(file);
preview.style.display="block";

}

});

generateBtn.addEventListener("click",()=>{

generateBtn.disabled=true;
generateBtn.innerText="LOADING...";

setTimeout(()=>{

generateBtn.disabled=false;
generateBtn.innerText="GENERATE";

},5000);

});

</script>

</body>
</html>
