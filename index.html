<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BANG_SAM12</title><style>
body{
background:#07142c;
font-family:Arial,sans-serif;
color:white;
margin:0;
padding:15px;
}

.container{
max-width:700px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:34px;
margin:0;
font-weight:bold;
}

.header p{
font-size:13px;
opacity:.8;
margin-top:5px;
}

.card{
background:#0d2348;
padding:15px;
border-radius:15px;
border:1px solid #1f4f9e;
margin-bottom:15px;
}

.row{
display:flex;
gap:10px;
margin-bottom:10px;
}

.row select,
.row input{
flex:1;
}

input,
select,
textarea{
width:100%;
padding:12px;

}

textarea{

}

button{

padding:12px;
border:none;

margin-top:10px;
}

#result{
min-height:120px;
border:1px dashed #4da3ff;
padding:10px;
border-radius:10px;
}

.output-box{
margin-top:10px;
}

small{
opacity:.8;
}
</style></head><body><div class="container"><div class="header">
<h1>🚀 BANG_SAM12</h1>
<p>Grok & Kling Studio</p>
</div><div class="card"><div class="row">

<button style="width:120px">CEK</button>
</div><small>Status: Belum dicek</small>

</div><div class="card"><div class="row">
<select>

</select>
</div><div class="row">

<option>Image to Video</option>

<option>Chat</option>
</select><select>
<option selected>720p</option>
<option>480p</option>
<option>1080p</option>
</select>
</div><div class="row">

<option selected>9:16</option>
<option>1:1</option>
<option>16:9</option>
</select><select>
<option>10 Detik</option>
<option>5 Detik</option>
</select>
</div><div class="output-box">
<select>
<option selected>Output 1</option>
