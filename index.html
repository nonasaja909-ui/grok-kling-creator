<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BANG_SAM12</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#071426;
color:white;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:38px;
font-weight:bold;
}

.header p{
opacity:.8;
margin-top:5px;
}

.card{
background:#102340;
border-radius:16px;
padding:15px;
margin-bottom:15px;
border:1px solid #1f4f9f;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-top:5px;
}

textarea{
height:120px;
resize:none;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
background:linear-gradient(
90deg,
#6d4cff,
#00c6ff
);
color:white;
}

.upload-box{
border:2px dashed #4da3ff;
padding:20px;
border-radius:12px;
text-align:center;
cursor:pointer;
}

.preview-wrap{
position:relative;
margin-top:10px;
}

#preview{
width:100%;
display:none;
border-radius:12px;
}

.remove-btn{
position:absolute;
top:10px;
right:10px;
width:40px;
height:40px;
border-radius:50%;
display:none;
}

.result-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}

.result-card{
background:#09172d;
padding:10px;
border-radius:12px;
}

.result-card img{
width:100%;
border-radius:10px;
cursor:pointer;
}

.download-btn{
margin-top:10px;
}

.video-box{
display:none;
margin-top:15px;
}

.video-box video{
width:100%;
border-radius:12px;
}

.fullscreen{
position:fixed;
top:0;
left:0;
width:100vw !important;
height:100vh !important;
object-fit:contain;
background:black;
z-index:9999;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🚀 BANG_SAM12</h1>
<p>Grok & Kling Studio</p>
</div>

<div class="card">

<label>GROK API KEY</label>
<input
type="password"
id="grokApi"
placeholder="Masukkan Grok API Key">

<br><br>

<label>KLING API KEY</label>
<input
type="password"
id="klingApi"
placeholder="Masukkan Kling API Key">

</div>

  <div class="card">

<div class="grid">

<select id="provider">
<option>Kling</option>
<option>Grok</option>
</select>

<select id="model">
<option>Kling 2.1 Pro</option>
<option>Kling 2.1</option>
<option>Grok 4</option>
<option>Grok 3</option>
<option>Grok 3 Mini</option>
</select>

<select id="mode">
<option>Image to Video</option>
<option>Text to Video</option>
<option>Image to Image</option>
<option>Text to Image</option>
<option>Chat</option>
</select>

<select id="resolution">
<option selected>720p</option>
<option>480p</option>
<option>1080p</option>
</select>

<select id="ratio">
<option selected>9:16</option>
<option>1:1</option>
<option>16:9</option>
</select>

<select id="duration">
<option>10 Detik</option>
<option>5 Detik</option>
</select>

</div>

<div id="outputBox"
style="margin-top:10px;">

<select id="output">
<option selected>Output 1</option>
<option>Output 2</option>
<option>Output 3</option>
<option>Output 4</option>
</select>

</div>

<br>

<div class="upload-box">

Upload Gambar

<input
type="file"
id="upload"
accept="image/*">

</div>

<div class="preview-wrap">

<img id="preview">

<button
id="removeImage"
class="remove-btn">
X
</button>

</div>

<br>

<textarea
id="prompt"
placeholder="Masukkan Prompt"></textarea>

<br>

<button id="generateBtn">
GENERATE
</button>

</div>

<div class="card">

<h3>HASIL</h3>

<div
id="imageResults"
class="result-grid">
</div>

<div
id="videoResult"
class="video-box">

<video
controls
id="videoPlayer">
</video>

<br><br>

<button>
DOWNLOAD VIDEO
</button>

</div>

</div>

   <script>

const upload=
document.getElementById("upload");

const preview=
document.getElementById("preview");

const removeBtn=
document.getElementById("removeImage");

const provider=
document.getElementById("provider");

const duration=
document.getElementById("duration");

const mode=
document.getElementById("mode");

const outputBox=
document.getElementById("outputBox");

const imageResults=
document.getElementById("imageResults");

const generateBtn=
document.getElementById("generateBtn");

upload.addEventListener(
"change",
e=>{

const file=e.target.files[0];

if(file){

preview.src=
URL.createObjectURL(file);

preview.style.display=
"block";

removeBtn.style.display=
"block";

}

});

removeBtn.onclick=()=>{

upload.value="";

preview.src="";

preview.style.display=
"none";

removeBtn.style.display=
"none";

};

provider.addEventListener(
"change",
()=>{

if(provider.value==="Kling"){

duration.innerHTML=`
<option>5 Detik</option>
<option>10 Detik</option>
`;

}else{

duration.innerHTML=`
<option>6 Detik</option>
<option>10 Detik</option>
`;

}

});

mode.addEventListener(
"change",
()=>{

if(
mode.value==="Image to Video" ||
mode.value==="Text to Video"
){

outputBox.style.display=
"none";

}else{

outputBox.style.display=
"block";

}

});

generateBtn.onclick=()=>{

generateBtn.disabled=true;

generateBtn.innerText=
"LOADING...";

setTimeout(()=>{

generateBtn.disabled=false;

generateBtn.innerText=
"GENERATE";

buatDummy();

},3000);

};

function buatDummy(){

imageResults.innerHTML="";

for(let i=1;i<=4;i++){

imageResults.innerHTML+=`

<div class="result-card">

<img
src="https://picsum.photos/400?random=${i}"
class="hasil">

<button
class="download-btn">
DOWNLOAD
</button>

</div>

`;

}

aktifFullscreen();

}
function aktifFullscreen(){

document
.querySelectorAll(".hasil")
.forEach(img=>{

img.onclick=()=>{

if(
img.classList.contains(
"fullscreen"
)
){

img.classList.remove(
"fullscreen"
);

}else{

img.classList.add(
"fullscreen"
);

}

};

});

}

</script>

</div>

</body>
</html>
