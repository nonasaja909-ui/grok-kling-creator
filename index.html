<body>

<div class="container">

<div class="header">
<h1>BANG_SAM12</h1>
<p>Grok & Kling Studio</p>
</div>

<div class="card">

<input type="password" placeholder="Masukkan API Key">

<button id="cekApi">CEK API</button>

<small>Status: Belum dicek</small>

</div>

<div class="card">

<div class="row">

<select id="provider">
<option selected>Kling</option>
<option>Grok</option>
</select>

<select id="model">
<option selected>Kling 2.1 Pro</option>
<option>Kling 2.1</option>
<option>Grok 4</option>
<option>Grok 3</option>
<option>Grok 3 Mini</option>
</select>

</div>

<div class="row">

<select id="mode">
<option>Image to Video</option>
<option>Text to Video</option>
<option>Image to Image</option>
<option>Text to Image</option>
<option>Chat</option>
</select>

<select id="resolusi">
<option selected>720p</option>
<option>480p</option>
<option>1080p</option>
</select>

</div>

<div class="row">

<select id="rasio">
<option selected>9:16</option>
<option>1:1</option>
<option>16:9</option>
</select>

<select id="durasi">
<option>5 Detik</option>
<option>10 Detik</option>
</select>

</div>

<div id="outputBox">

<select id="output">
<option selected>Output 1</option>
<option>Output 2</option>
<option>Output 3</option>
<option>Output 4</option>
</select>

</div>

<br>

<input type="file" id="upload" accept="image/*">

<br><br>

<img id="preview"
style="width:100%;display:none;border-radius:10px;">

<br><br>

<textarea
id="prompt"
placeholder="Masukkan Prompt"></textarea>

<button id="generateBtn">
GENERATE
</button>

</div>

<div class="card">

<h3>HASIL</h3>

<div id="result">
Belum ada hasil
</div>

<button id="downloadBtn">
DOWNLOAD
</button>

</div>

</div><script>

const mode=document.getElementById("mode");
const outputBox=document.getElementById("outputBox");
const provider=document.getElementById("provider");
const durasi=document.getElementById("durasi");
const upload=document.getElementById("upload");
const preview=document.getElementById("preview");
const generateBtn=document.getElementById("generateBtn");

mode.addEventListener("change",()=>{

if(
mode.value==="Image to Video" ||
mode.value==="Text to Video"
){
outputBox.style.display="none";
}else{
outputBox.style.display="block";
}

});

provider.addEventListener("change",()=>{

if(provider.value==="Kling"){

durasi.innerHTML=`
<option>5 Detik</option>
<option>10 Detik</option>
`;

}else{

durasi.innerHTML=`
<option>6 Detik</option>
<option>10 Detik</option>
`;

}

});

upload.addEventListener("change",(e)=>{

const file=e.target.files[0];

if(file){

preview.src=URL.createObjectURL(file);
preview.style.display="block";

}

});

generateBtn.addEventListener("click",()=>{

generateBtn.disabled=true;
generateBtn.innerText="LOADING...";

setTimeout(()=>{

generateBtn.disabled=false;
generateBtn.innerText="GENERATE";

},5000);

});

</script>

</body>
</html>
