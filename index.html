<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok & Kling Creator</title>

<style>
body{
background:#07142c;
font-family:Arial,sans-serif;
color:white;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:#0d2348;
padding:15px;
border-radius:15px;
margin-bottom:15px;
border:1px solid #1f4f9e;
}

input,select,textarea{
width:100%;
padding:12px;
margin-top:5px;
margin-bottom:12px;
border-radius:10px;
border:none;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#6d4cff,#00c6ff);
color:white;
font-weight:bold;
}

h1{
text-align:center;
}

#result{
min-height:150px;
border:1px dashed #4da3ff;
padding:10px;
border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 Grok & Kling Creator</h1>

<div class="card">

<label>API Key</label>
<input type="password" placeholder="Masukkan API Key">

<button>Cek API Key</button>

<p>Status: Belum dicek</p>

</div>

<div class="card">

<label>Provider</label>
<select>
<option>Grok</option>
<option>Kling</option>
</select>

<label>Model</label>
<select>
<option>Grok 4</option>
<option>Grok 3</option>
<option>Grok 3 Mini</option>
<option>Kling 2.1</option>
<option>Kling 2.1 Pro</option>
</select>

<label>Mode</label>
<select>
<option>Chat</option>
<option>Text to Image</option>
<option>Image to Image</option>
<option>Text to Video</option>
<option>Image to Video</option>
</select>

<label>Rasio</label>
<select>
<option>1:1</option>
<option>9:16</option>
<option>16:9</option>
</select>

<label>Durasi Video</label>
<select>
<option>5 Detik</option>
<option>10 Detik</option>
</select>

<label>Upload Gambar</label>
<input type="file">

<label>Prompt</label>
<textarea rows="6"></textarea>

<button>Generate</button>

</div>

<div class="card">

<h2>Hasil</h2>

<div id="result">
Belum ada hasil
</div>

</div>

</div>

</body>
</html>
